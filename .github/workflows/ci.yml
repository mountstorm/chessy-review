name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Same official Stockfish build as local development and the Vercel deploy (see scripts/fetch_stockfish_linux.sh).
      # Cached so the ~98 MB download only happens when the script (and so the pinned version) changes.
      - name: Cache Stockfish
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: vendor/stockfish-linux-x86-64
          key: stockfish-${{ runner.os }}-${{ hashFiles('scripts/fetch_stockfish_linux.sh') }}

      - name: Download Stockfish
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch_stockfish_linux.sh

      # The tests look for `stockfish` on PATH and skip the engine tests when it isn't there.
      - name: Put Stockfish on PATH
        run: |
          chmod +x "$PWD/vendor/stockfish-linux-x86-64"
          sudo ln -sf "$PWD/vendor/stockfish-linux-x86-64" /usr/local/bin/stockfish
          printf 'uci\nquit\n' | stockfish | grep 'id name'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -rs --junitxml=junit.xml

      # A skipped test is a test that did not run. Without this, a missing Stockfish would still show a green check.
      - name: Fail if any test was skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("junit.xml").getroot().iter("testsuite"))
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{total} tests, {skipped} skipped")
          if total == 0 or skipped:
              sys.exit("CI requires every test to run: none may be skipped (is Stockfish on PATH?)")
          PY
